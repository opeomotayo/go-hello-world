pipeline:
  name: go-hello-world
  identifier: gohelloworld
  projectIdentifier: default_project
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: GitHub_Connector
        repoName: go-hello-world
        build: <+input>
  stages:
    - parallel:
        - stage:
            name: Run Go Tests
            identifier: run_go_tests
            type: CI
            spec:
              cloneCodebase: true
              infrastructure:
                type: KubernetesDirect
                spec:
                  connectorRef: Kubernetes_Cluster_Connector
                  namespace: preprod
                  automountServiceAccountToken: true
                  nodeSelector: {}
                  os: Linux
              execution:
                steps:
                  - step:
                      type: Run
                      name: Go Test
                      identifier: go_test
                      spec:
                        connectorRef: Docker_Hub_Connector
                        image: golang:1.26.5
                        shell: Sh
                        command: |
                          set -e
                          go mod download
                          go install github.com/jstemmer/go-junit-report/v2@latest
                          go test ./... -v -coverprofile=coverage.out 2>&1 | go-junit-report -set-exit-code > report.xml
                          go tool cover -func=coverage.out
                        reports:
                          type: JUnit
                          spec:
                            paths:
                              - report.xml
        - stage:
            name: SonarQube Scan
            identifier: sonarqube_scan
            type: CI
            spec:
              cloneCodebase: true
              infrastructure:
                type: KubernetesDirect
                spec:
                  connectorRef: Kubernetes_Cluster_Connector
                  namespace: preprod
                  automountServiceAccountToken: true
                  nodeSelector: {}
                  os: Linux
              execution:
                steps:
                  - step:
                      type: Sonarqube
                      name: SonarQube Scan
                      identifier: sonarqube_scan_step
                      timeout: 20m
                      spec:
                        mode: orchestration
                        config: default
                        target:
                          type: repository
                          name: go-hello-world
                          variant: <+codebase.branch>
                        advanced:
                          log:
                            level: info
                        auth:
                          domain: http://sonarqube.tools.svc.cluster.local:9000
                          access_token: <+secrets.getValue("SonarQube_Token")>
                          ssl_verify: true
                        tool:
                          project: go-hello-world
                        fail_on_severity: High
                        resources:
                          limits:
                            memory: 2Gi
                            cpu: 2000m
        - stage:
            name: Build App
            identifier: Build_App
            description: ""
            type: CI
            spec:
              cloneCodebase: true
              infrastructure:
                type: KubernetesDirect
                spec:
                  connectorRef: Kubernetes_Cluster_Connector
                  namespace: preprod
                  automountServiceAccountToken: true
                  nodeSelector: {}
                  os: Linux
              execution:
                steps:
                  - step:
                      type: Run
                      name: Go Build
                      identifier: go_build
                      spec:
                        connectorRef: Docker_Hub_Connector
                        image: golang:1.26.5
                        shell: Sh
                        command: |
                          set -e
                          go mod download
                          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o go-hello-world .
                          ls -lh go-hello-world
                  - step:
                      type: Run
                      name: Package Artefact
                      identifier: package_artefact
                      spec:
                        connectorRef: Docker_Hub_Connector
                        image: alpine:3.20
                        shell: Sh
                        command: |
                          set -e
                          tar -czvf go-hello-world-<+pipeline.sequenceId>.tar.gz go-hello-world Dockerfile
                          ls -lh go-hello-world-<+pipeline.sequenceId>.tar.gz
    - stage:
        name: Publish Artefact
        identifier: publish_artefact
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: Kubernetes_Cluster_Connector
              namespace: preprod
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
          execution:
            steps:
              - step:
                  type: Run
                  name: Go Build
                  identifier: go_build
                  spec:
                    connectorRef: Docker_Hub_Connector
                    image: golang:1.26.5
                    shell: Sh
                    command: |
                      set -e
                      go mod download
                      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o go-hello-world .
              - step:
                  type: Run
                  name: Package Artefact
                  identifier: package_artefact
                  spec:
                    connectorRef: Docker_Hub_Connector
                    image: alpine:3.20
                    shell: Sh
                    command: |
                      set -e
                      tar -czvf go-hello-world-<+pipeline.sequenceId>.tar.gz go-hello-world Dockerfile
              - step:
                  type: SaveCacheS3
                  name: Publish Artefact to MinIO
                  identifier: publish_artefact_minio
                  spec:
                    connectorRef: MinIO_Connector
                    region: eu-west-2
                    bucket: harness-artefact
                    key: go-app-artefact-<+pipeline.sequenceId>
                    sourcePaths:
                      - go-hello-world-<+pipeline.sequenceId>.tar.gz
                    archiveFormat: Tar
                    endpoint: http://minio.tools.svc.cluster.local:9000
                    pathStyle: true
                    override: true
    - stage:
        name: Restore Artefact and Publish Image
        identifier: restore_artefact_and_publish_image
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: Kubernetes_Cluster_Connector
              namespace: preprod
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
          execution:
            steps:
              - step:
                  type: RestoreCacheS3
                  name: Restore Artefact from MinIO
                  identifier: restore_artefact_minio
                  spec:
                    connectorRef: MinIO_Connector
                    region: eu-west-2
                    bucket: harness-artefact
                    key: go-app-artefact-<+pipeline.sequenceId>
                    archiveFormat: Tar
                    endpoint: http://minio.tools.svc.cluster.local:9000
                    pathStyle: true
              - step:
                  type: Run
                  name: Unpack Artefact
                  identifier: unpack_artefact
                  spec:
                    connectorRef: Docker_Hub_Connector
                    image: alpine:3.20
                    shell: Sh
                    command: |
                      set -e
                      tar -xzvf go-hello-world-<+pipeline.sequenceId>.tar.gz
                      ls -lh go-hello-world Dockerfile
              - step:
                  type: BuildAndPushDockerRegistry
                  name: Build and Push Docker Image
                  identifier: build_and_push_docker_image
                  spec:
                    connectorRef: Docker_Hub_Connector
                    repo: opeomotayo/go-hello-world
                    tags:
                      - <+pipeline.sequenceId>
                    dockerfile: Dockerfile
                    context: .
                    caching: true
    - stage:
        name: Deploy PreProd
        identifier: Deploy_PreProd
        description: ""
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: gohelloworld
            serviceInputs:
              serviceDefinition:
                type: Kubernetes
                spec:
                  artifacts:
                    primary:
                      primaryArtifactRef: <+input>
                      sources: <+input>
          environment:
            environmentRef: PreProd_Environment
            deployToAll: false
            infrastructureDefinitions:
              - identifier: PreProd_Infrastructure
          execution:
            steps:
              - step:
                  name: Rollout Deployment
                  identifier: rolloutDeployment
                  type: K8sRollingDeploy
                  timeout: 10m
                  spec:
                    skipDryRun: false
                    pruningEnabled: false
            rollbackSteps:
              - step:
                  name: Rollback Rollout Deployment
                  identifier: rollbackRolloutDeployment
                  type: K8sRollingRollback
                  timeout: 10m
                  spec:
                    pruningEnabled: false
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
